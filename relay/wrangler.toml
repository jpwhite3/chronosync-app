name = "chronosync-relay"
main = "src/index.ts"
compatibility_date = "2025-04-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Replace this with the deployed web application's exact origin before release.
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:8080"
